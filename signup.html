<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./assets/style/signupstyle.css" />
    <title>Sign Up</title>
  </head>
  <body>
    <main>
      <section aria-labelledby="Sign up heading" class="imgClass">
        <img
          src="./assets/images/campaign-creators-gMsnXqILjp4-unsplash.jpg"
          alt="image of people having a meeting"
        />
      </section>
      <section aria-labelledby="Sign up form" class="contentClass">
        <div class="sub-container">
          <header>
            <h1>Sign Up</h1>
          </header>
          <form action="">
            <div class="label-input">
              <label for="name">Full Name</label>
              <input
                type="text"
                name="name"
                id="name"
                placeholder="Full Name"
              />
            </div>
            <div class="label-input">
              <label for="email">Email</label>
              <input type="email" name="email" id="email" placeholder="Email" />
            </div>
            <div class="label-input">
              <label for="password">Password</label>
              <input
                type="password"
                name="password"
                id="password"
                placeholder="Password"
              />
            </div>

            <button type="submit">Create Account</button>
          </form>

          <div class="otherActivities">
            <p>Already have an account? <a href="/signin.html">Sign in</a></p>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
